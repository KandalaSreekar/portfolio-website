<section id="hero" class="hero">
  <div class="hero-content">
    <p class="hero-greeting">Hello, I'm</p>
    <h1 class="hero-name">Sreekar Kandala</h1>
    <h2 class="hero-title">Frontend Developer</h2>
    <p class="hero-description">
      Passionate about creating beautiful, responsive web applications with modern technologies.
      Specialized in Angular and React with strong backend skills in Node.js.
    </p>
    <div class="hero-actions">
      <p-button label="Download CV" icon="pi pi-download" />
      <p-button label="Contact Me" icon="pi pi-send" [outlined]="true" (onClick)="scrollToContact()" />
    </div>
    <div class="hero-social">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <i class="pi pi-github"></i>
      </a>
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <i class="pi pi-linkedin"></i>
      </a>
      <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
        <i class="pi pi-twitter"></i>
      </a>
    </div>
  </div>
  <div class="hero-decoration">
    <div class="hero-blob"></div>
  </div>
</section>
